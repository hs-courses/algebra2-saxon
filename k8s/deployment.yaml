apiVersion: apps/v1
kind: Deployment
metadata:
  name: algebra2
  namespace: algebra2
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on a ReadWriteOnce volume — never run two pods against it at once.
  selector:
    matchLabels:
      app: algebra2
  template:
    metadata:
      labels:
        app: algebra2
    spec:
      containers:
        - name: algebra2
          image: logycon/algebra2-saxon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "file:/data/prod.db"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: algebra2-data
